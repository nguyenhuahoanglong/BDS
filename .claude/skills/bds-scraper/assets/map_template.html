<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
/* ===== RESET & BASE ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;overflow:hidden}

/* ===== DESKTOP LAYOUT (min-width: 769px) ===== */
#map{position:absolute;top:0;left:0;right:320px;bottom:0}
#panel{position:absolute;top:0;right:0;width:320px;bottom:0;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:-2px 0 8px rgba(0,0,0,.15);z-index:1000}
#plist-wrap{flex:1;overflow-y:auto}

/* Header */
.ph{background:linear-gradient(135deg,#2E86AB,#1a5c7a);color:#fff;padding:12px 14px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph h2{font-size:15px;margin-bottom:3px}.ph p{font-size:11px;opacity:.85}
.ph-txt{min-width:0;text-align:left}.ph-txt h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Loan-calculator link in headers */
.calc-link{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;color:#fff;background:rgba(255,255,255,.18);padding:9px 13px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;line-height:1.2;white-space:nowrap;transition:background .15s}
.calc-link:hover{background:rgba(255,255,255,.3)}

/* Search bar */
.search-bar{padding:8px 12px;border-bottom:1px solid #eee;flex-shrink:0;display:flex;gap:6px;align-items:center}
.search-bar input{flex:1;padding:7px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:#2E86AB}
.sort-select{padding:6px 8px;border:1.5px solid #ddd;border-radius:8px;font-size:12px;font-family:inherit;outline:none;cursor:pointer;background:#fff;color:#333;flex-shrink:0}
.sort-select:focus{border-color:#2E86AB}

/* Filter chips */
.filters{padding:8px 12px;display:flex;gap:6px;border-bottom:1px solid #eee;flex-shrink:0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:6px 12px;border:1.5px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;white-space:nowrap;min-height:36px;flex-shrink:0}
.filters button.active{border-color:#2E86AB;background:#E8F4FD;color:#2E86AB}
.filters button:hover{border-color:#2E86AB}

/* Card list items */
.pi{padding:10px 12px 10px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .2s;display:flex;min-height:60px}
.pi:hover{background:#f5f9fc}
.pi.hidden{display:none}
.pi.active{background:#EBF5FB}
.pi-stripe{width:4px;min-width:4px;border-radius:0 2px 2px 0;margin-right:10px;align-self:stretch}
.pi-body{flex:1;min-width:0}
.pi-row1{display:flex;align-items:baseline;gap:4px;margin-bottom:3px}
.pn{font-weight:600;font-size:14px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;flex-shrink:0}
.pi-row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.price-chip{background:#e74c3c;color:#fff;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.pf{font-size:12px;color:#666}
.pf-addr{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Badge colors (district-specific classes defined dynamically via JS) */

/* ===== INFRASTRUCTURE LEGEND ===== */
.infra-legend{background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:12px;line-height:1.8}
.infra-legend h4{margin:0 0 6px;font-size:13px;font-weight:700}
.infra-legend .legend-line{display:inline-block;width:30px;height:0;border-top:3px solid #666;vertical-align:middle;margin-right:6px}
.infra-legend .legend-line.dashed{border-top-style:dashed}
.infra-legend .legend-line.dotted{border-top-style:dotted}
.station-marker{background:#fff;border:2px solid #4CAF50;border-radius:50%;width:10px;height:10px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* Name labels — visible at high zoom via separate layer */
.bds-name-label{background:rgba(255,255,255,.92);border:1px solid #ccc;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;color:#333;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* ===== MOBILE LAYOUT (max-width: 768px) ===== */
@media(max-width:768px){
  body{overflow:hidden}

  /* Map fills full viewport */
  #map{position:fixed;top:0;left:0;right:0;bottom:0}

  /* Hide desktop panel */
  #panel{display:none}

  /* ===== BOTTOM SHEET ===== */
  #sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:1000;
    background:#fff;
    border-radius:16px 16px 0 0;
    box-shadow:0 -4px 20px rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    touch-action:none;
    transition:transform 0.3s ease;
    /* Height is managed by JS snap points via transform */
    height:95vh;
    transform:translateY(calc(95vh - 120px)); /* default: peek */
  }
  #sheet.snapping{transition:transform 0.3s ease}
  #sheet.no-transition{transition:none}

  /* Drag handle */
  #drag-handle{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 0 6px;
    touch-action:none;
    cursor:grab;
  }
  #drag-handle-bar{
    width:40px;height:4px;
    background:#ccc;border-radius:2px;
  }

  /* Sheet header */
  .sh-header{
    flex-shrink:0;
    background:linear-gradient(135deg,#2E86AB,#1a5c7a);
    color:#fff;
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .sh-header h2{font-size:15px;margin-bottom:2px}
  .sh-header p{font-size:11px;opacity:.85}

  /* Sheet scrollable area */
  #sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* Dim overlay at full snap */
  #sheet-overlay{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.3);
    z-index:999;
  }

  /* Infrastructure toggle button (mobile) */
  #infra-btn{
    position:fixed;
    left:12px;
    bottom:130px;
    z-index:1001;
    width:40px;height:40px;
    border-radius:50%;
    background:#fff;
    border:none;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#555;
  }

  /* Filters in sheet */
  .filters{padding:6px 10px}
  .filters button{font-size:11px;padding:5px 10px;min-height:34px}

  /* Cards in sheet */
  .pi{padding:8px 10px 8px 0;min-height:56px}
  .pn{font-size:14px}
  .pf{font-size:12px}
  .pf-addr{font-size:11px}

  /* Legend above bottom sheet on mobile */
  .leaflet-bottom.leaflet-left{bottom:55vh;z-index:1001}
  .infra-legend{max-height:40vh;overflow-y:auto}
}

/* ===== EDIT MODE ===== */
/* Edit mode toolbar */
.edit-toolbar{position:absolute;top:8px;right:328px;z-index:1100;display:flex;gap:6px;background:rgba(255,255,255,.95);padding:6px 8px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.edit-toolbar button{padding:6px 10px;border:1.5px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-weight:600}
.edit-toolbar button.active{background:#2E86AB;color:#fff;border-color:#2E86AB}
.edit-toolbar .dirty-badge{padding:4px 8px;background:#e74c3c;color:#fff;border-radius:6px;font-size:11px;font-weight:700;display:none}
.edit-toolbar .dirty-badge.show{display:inline-block}
@media(max-width:768px){.edit-toolbar{right:8px;top:8px}}

/* Edit mode marker style: dashed border */
.cm.editing > div{border-style:dashed !important;border-width:3px !important;cursor:move}

/* Modal */
.bds-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center;padding:12px}
.bds-modal.show{display:flex}
.bds-modal-card{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.bds-modal-card h3{margin-bottom:12px;font-size:16px}
.bds-modal-card label{display:block;font-size:12px;font-weight:600;color:#555;margin:8px 0 3px}
.bds-modal-card input,.bds-modal-card select,.bds-modal-card textarea{width:100%;padding:7px 9px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
.bds-modal-card input:focus,.bds-modal-card select:focus,.bds-modal-card textarea:focus{border-color:#2E86AB}
.bds-modal-card .row{display:flex;gap:8px}
.bds-modal-card .row > *{flex:1}
.bds-modal-footer{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}
.bds-modal-footer button{padding:8px 14px;border-radius:6px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-weight:600}
.bds-modal-footer .primary{background:#2E86AB;color:#fff;border-color:#2E86AB}
.bds-modal-footer .danger{background:#e74c3c;color:#fff;border-color:#e74c3c}

/* Restore banner */
.restore-banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1500;background:#fff;border:2px solid #f9a825;border-radius:8px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:none;align-items:center;gap:10px;font-size:13px}
.restore-banner.show{display:flex}
.restore-banner button{padding:5px 10px;border-radius:5px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:600;font-size:12px}
.restore-banner button.primary{background:#2E86AB;color:#fff;border-color:#2E86AB}

/* Starred indicator in list card */
.star-indicator{color:#f9a825;font-size:14px;margin-left:4px;flex-shrink:0}
.user-note-indicator{font-size:12px;color:#888;margin-left:4px;flex-shrink:0}
.manual-badge{background:#9c27b0;color:#fff;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;flex-shrink:0;margin-left:4px}
</style>
</head>
<body>
<!-- ===== EDIT MODE TOOLBAR ===== -->
<div class="edit-toolbar">
  <button id="btn-edit-toggle">✏️ Edit</button>
  <button id="btn-add-listing" style="display:none">➕ Add</button>
  <button id="btn-export-json" style="display:none">💾 Export</button>
  <span class="dirty-badge" id="dirty-badge">0 thay đổi</span>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="bds-modal" id="edit-modal">
  <div class="bds-modal-card">
    <h3 id="modal-title">Edit listing</h3>
    <label>Tên dự án*</label>
    <input id="f-name" />
    <div class="row">
      <div><label>Loại</label><input id="f-type" placeholder="Chung cu" /></div>
      <div><label>Quận*</label><select id="f-district"></select></div>
    </div>
    <div class="row">
      <div><label>Giá</label><input id="f-price" placeholder="3.2 tỷ hoặc 3-5 tỷ" /></div>
      <div><label>Diện tích</label><input id="f-area" placeholder="65m2" /></div>
    </div>
    <div class="row">
      <div><label>Phòng ngủ</label><input id="f-beds" /></div>
      <div><label>WC</label><input id="f-wc" /></div>
    </div>
    <label>Địa chỉ</label>
    <input id="f-addr" />
    <div class="row">
      <div><label>Lat*</label><input id="f-lat" type="number" step="0.0000001" /></div>
      <div><label>Lng*</label><input id="f-lng" type="number" step="0.0000001" /></div>
    </div>
    <label>Link BDS</label>
    <input id="f-link" />
    <label>Note (investor/broker)</label>
    <input id="f-note" />
    <label>Ghi chú riêng</label>
    <textarea id="f-user-note" rows="2"></textarea>
    <label><input type="checkbox" id="f-starred" style="width:auto;margin-right:6px" />⭐ Starred</label>
    <div class="bds-modal-footer">
      <button id="btn-modal-delete" class="danger" style="display:none">🗑 Delete</button>
      <button id="btn-modal-cancel">Cancel</button>
      <button id="btn-modal-save" class="primary">Save</button>
    </div>
  </div>
</div>

<!-- ===== RESTORE BANNER ===== -->
<div class="restore-banner" id="restore-banner">
  <span>📝 Có thay đổi chưa lưu từ lần trước.</span>
  <button class="primary" id="btn-restore">Restore</button>
  <button id="btn-discard">Discard</button>
</div>

<!-- ===== MAP ===== -->
<div id="map"></div>

<!-- ===== DESKTOP PANEL ===== -->
<div id="panel">
  <div class="ph"><div class="ph-txt"><h2>{{TITLE}}</h2><p>{{SUBTITLE}}</p></div><a href="loan-calculator.html" class="calc-link">🧮 Tính lãi vay</a></div>
  <div class="search-bar">
    <input type="text" id="search-desktop" placeholder="Tim kiem du an..." autocomplete="off"/>
    <select class="sort-select" id="sort-desktop">
      <option value="default">Mac dinh</option>
      <option value="price-asc">Gia tang dan</option>
      <option value="price-desc">Gia giam dan</option>
      <option value="name-asc">Ten A-Z</option>
    </select>
  </div>
  <div class="filters" id="filters-desktop"></div>
  <div id="plist-wrap"><div id="plist"></div></div>
</div>

<!-- ===== MOBILE BOTTOM SHEET ===== -->
<div id="sheet-overlay"></div>
<div id="sheet" style="display:none">
  <div id="drag-handle"><div id="drag-handle-bar"></div></div>
  <div class="sh-header"><div class="ph-txt"><h2>{{TITLE}}</h2><p>{{SUBTITLE}}</p></div><a href="loan-calculator.html" class="calc-link">🧮 Tính lãi</a></div>
  <div class="search-bar">
    <input type="text" id="search-mobile" placeholder="Tim kiem du an..." autocomplete="off"/>
    <select class="sort-select" id="sort-mobile">
      <option value="default">Mac dinh</option>
      <option value="price-asc">Gia tang dan</option>
      <option value="price-desc">Gia giam dan</option>
      <option value="name-asc">Ten A-Z</option>
    </select>
  </div>
  <div class="filters" id="filters-mobile"></div>
  <div id="sheet-scroll"><div id="plist-mobile"></div></div>
</div>

<!-- Mobile infrastructure toggle button -->
<button id="infra-btn" style="display:none" title="Ha tang giao thong">i</button>

<script>
// ===== DISTRICT DATA =====
var districts = {{DISTRICTS_JSON}};

// ===== DISTRICT COLORS =====
var dColors = {{COLORS_JSON}};

// ===== PROJECT DATA =====
var projects = {{PROJECTS_JSON}};

// ===== INFRASTRUCTURE DATA =====
var infrastructure = {{INFRASTRUCTURE_JSON}};

// ===== HELPERS =====
function removeDiacritics(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function parseMinPrice(priceStr) {
  if (!priceStr) return Infinity;
  var m = String(priceStr).match(/(\d+\.?\d*)/);
  return m ? parseFloat(m[1]) : Infinity;
}

// ===== BADGE STYLES =====
var districtKeys = [].concat.apply([], [projects.map(function(p){return p.district;})]).filter(function(v,i,a){return a.indexOf(v)===i;});
var palColors = ['#3498db','#e67e22','#2ecc71','#9b59b6','#e74c3c','#1abc9c','#f39c12','#795548'];
var badgeCSS = districtKeys.map(function(d, i) {
  var c = palColors[i % palColors.length];
  return '.badge-' + d + '{background:' + c + '22;color:' + c + '}';
}).join('\n');
var styleEl = document.createElement('style');
styleEl.textContent = badgeCSS;
document.head.appendChild(styleEl);

// Color by district index
function districtColor(d) {
  var idx = districtKeys.indexOf(d);
  return palColors[idx < 0 ? 0 : idx % palColors.length];
}

// ===== MAP INITIALIZATION =====
var map = L.map('map').setView([10.78,106.66],12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19}).addTo(map);

// ===== DISTRICT POLYGONS =====
var polys = {};
for(var dn in districts){
  var c = dColors[dn] || '#999';
  polys[dn] = L.polygon(districts[dn],{color:c,weight:2,dashArray:'6,4',fillColor:c,fillOpacity:0.08}).addTo(map);
  var cn = polys[dn].getBounds().getCenter();
  L.marker(cn,{icon:L.divIcon({className:'dl',html:'<div style="font-size:11px;font-weight:700;color:'+c+';text-shadow:1px 1px 2px white,-1px -1px 2px white,1px -1px 2px white,-1px 1px 2px white;white-space:nowrap">'+dn+'</div>',iconSize:[80,15],iconAnchor:[40,7]})}).addTo(map);
}

// ===== MARKER CLUSTER =====
var clusterGroup = L.markerClusterGroup({maxClusterRadius:50, spiderfyOnMaxZoom:true});
map.addLayer(clusterGroup);

// ===== STATE =====
var activeDistrict = 'all';
var activeStarredOnly = false;
var searchQuery = '';
var sortOrder = 'default';

// ===== BUILD MARKERS & LIST ITEMS =====
var markers = [];  // [{mk, data, listDesktop, listMobile}]
var listEl = document.getElementById('plist');
var listMobileEl = document.getElementById('plist-mobile');

projects.forEach(function(p, i) {
  var color = districtColor(p.district);

  // Marker icon
  var icon = L.divIcon({
    className:'cm',
    html:'<div style="background:'+color+';color:white;border:2px solid '+color+';border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.3)">'+String(i+1)+'</div>',
    iconSize:[26,26],iconAnchor:[13,13]
  });

  var mk = L.marker([p.lat,p.lng],{icon:icon});

  // Popup
  var bedsWc = '';
  if(p.beds) bedsWc += p.beds + ' PN';
  if(p.wc) bedsWc += (bedsWc ? ' | ' : '') + p.wc + ' WC';
  var conf = p.price_confidence || 'low';
  var confColor = (conf==='high'?'#2e7d32':(conf==='medium'?'#f9a825':'#c62828'));
  var confLabel = (conf==='high'?'Tin cay CAO':(conf==='medium'?'Tin cay TB':'Tin cay THAP'));
  var vipLabel = ({diamond:'VIP Kim Cuong',gold:'VIP Vang',silver:'VIP Bac'})[p.vip_tier]||'';
  var sellerLabel = ({broker_pro:'Moi gioi pro',agency:'Cong ty',individual:'Ca nhan'})[p.seller_type]||'';
  var ppm2Str = (typeof p.price_per_m2 === 'number') ? (' (~'+p.price_per_m2.toFixed(1)+' tr/m2)') : '';
  var popupHtml = '<div style="min-width:200px"><h3 style="margin:0 0 5px;font-size:14px">'+String(i+1)+'. '+p.name+'</h3>'
    + '<div style="margin:0 0 4px"><span style="background:'+confColor+';color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700">'+confLabel+'</span>'
    + (vipLabel?' <span style="background:#FFD700;color:#000;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700">'+vipLabel+'</span>':'')
    + (sellerLabel?' <span style="background:#eee;color:#333;padding:1px 6px;border-radius:3px;font-size:10px">'+sellerLabel+'</span>':'')
    + '</div>'
    + '<div style="font-size:12px;line-height:1.5"><b style="color:#e74c3c">'+p.price+'</b>'+ppm2Str+'<br>'+(p.area||'')+(bedsWc ? ' | '+bedsWc : '')+'<br>'+(p.addr||'')+'<br>'+(p.note||'');
  if(p.link) popupHtml += '<br><a href="'+p.link+'" target="_blank" style="color:#0563C1">Xem BDS</a>';
  popupHtml += '</div></div>';
  mk.bindPopup(popupHtml);
  mk.bindTooltip(p.name, {direction: 'right', offset: [13, 0], className: 'bds-name-label'});

  // Create list card (used for both desktop and mobile)
  function makeCard() {
    var div = document.createElement('div');
    div.className = 'pi';
    div.dataset.district = p.district;
    div.dataset.idx = String(i);

    var stripe = document.createElement('div');
    stripe.className = 'pi-stripe';
    stripe.style.background = color;

    var body = document.createElement('div');
    body.className = 'pi-body';

    var row1 = document.createElement('div');
    row1.className = 'pi-row1';
    var nameEl = document.createElement('div');
    nameEl.className = 'pn';
    nameEl.textContent = String(i+1)+'. '+p.name;
    var badgeEl = document.createElement('span');
    badgeEl.className = 'badge badge-'+p.district;
    badgeEl.textContent = p.district.toUpperCase();
    row1.appendChild(nameEl);
    row1.appendChild(badgeEl);
    // Starred / user_note / manual indicators
    if(p.starred) {
      var starEl = document.createElement('span');
      starEl.className = 'star-indicator';
      starEl.textContent = '⭐';
      row1.appendChild(starEl);
    }
    if(p.user_note) {
      var noteEl = document.createElement('span');
      noteEl.className = 'user-note-indicator';
      noteEl.title = p.user_note;
      noteEl.textContent = '📝';
      row1.appendChild(noteEl);
    }
    if(p.manual) {
      var manualEl = document.createElement('span');

function highlightListItem(idx) {
  document.querySelectorAll('.pi.active').forEach(function(el){el.classList.remove('active')});

  if(!m) return;
  [m.listDesktop, m.listMobile].forEach(function(card) {

      card.classList.add('active');
      card.scrollIntoView({behavior:'smooth', block:'nearest'});

}

// ===== APPLY FILTERS (unified) =====
function applyFilters() {
  var q = removeDiacritics(searchQuery);
  var sortedIndices = projects.map(function(_,i){return i;});

  // Sort
  if(sortOrder === 'price-asc') {
    sortedIndices.sort(function(a,b){ return parseMinPrice(projects[a].price) - parseMinPrice(projects[b].price); });
  } else if(sortOrder === 'price-desc') {
    sortedIndices.sort(function(a,b){ return parseMinPrice(projects[b].price) - parseMinPrice(projects[a].price); });
  } else if(sortOrder === 'name-asc') {
    sortedIndices.sort(function(a,b){ return removeDiacritics(projects[a].name).localeCompare(removeDiacritics(projects[b].name)); });
  }

  // Reorder DOM (both lists)
  sortedIndices.forEach(function(idx) {
    listEl.appendChild(markers[idx].listDesktop);
    listMobileEl.appendChild(markers[idx].listMobile);
  });

  // Show/hide and update cluster
  clusterGroup.clearLayers();
  sortedIndices.forEach(function(idx) {
    var m = markers[idx];
    var p = m.data;
    var districtMatch = (activeDistrict === 'all' || p.district === activeDistrict);
    var nameNorm = removeDiacritics(p.name);
    var addrNorm = removeDiacritics(p.addr);
    var searchMatch = !q || nameNorm.indexOf(q) !== -1 || addrNorm.indexOf(q) !== -1;
    var starredMatch = !activeStarredOnly || p.starred;
    var visible = districtMatch && searchMatch && starredMatch;

    if(visible) {
      m.listDesktop.classList.remove('hidden');
      m.listMobile.classList.remove('hidden');
      clusterGroup.addLayer(m.mk);
    } else {
      m.listDesktop.classList.add('hidden');
      m.listMobile.classList.add('hidden');
    }
  });

  // Zoom to district polygon or filtered bounds
  if(activeDistrict !== 'all') {
    for(var pn in polys) {
      if(pn.toLowerCase().replace(/[^a-z0-9]/g,'').indexOf(activeDistrict.toLowerCase().replace(/[^a-z0-9]/g,'')) !== -1) {
        map.fitBounds(polys[pn].getBounds().pad(0.1));
        return;
      }
    }
    var filtered = markers.filter(function(m){ return m.data.district === activeDistrict; });
    if(filtered.length) {
      map.fitBounds(filtered.map(function(m){return[m.data.lat,m.data.lng];}),{padding:[30,30]});
    }
  }
}

// ===== MOBILE SETUP =====
(function() {
  var isMobile = window.innerWidth <= 768;
  if(!isMobile) return;

  var sheet = document.getElementById('sheet');
  var overlay = document.getElementById('sheet-overlay');
  var handle = document.getElementById('drag-handle');
  var sheetScroll = document.getElementById('sheet-scroll');
  var infraBtn = document.getElementById('infra-btn');
  var sheetHeight = sheet.offsetHeight || window.innerHeight * 0.95;

  // Snap points (translateY values): peek, half, full
  var PEEK = sheetHeight - 120;  // shows handle + header + filters
  var HALF = sheetHeight - window.innerHeight * 0.5;
  var FULL = sheetHeight - window.innerHeight * 0.9;
  var snapPoints = [PEEK, HALF, FULL];

  // Show sheet
  sheet.style.display = 'flex';
  infraBtn.style.display = 'flex';

  var currentTranslateY = HALF;  // default: half
  function setSnap(y, animate) {
    currentTranslateY = y;
    if(animate) {
      sheet.classList.add('snapping');
    } else {
      sheet.classList.add('no-transition');
    }
    sheet.style.transform = 'translateY(' + y + 'px)';
    // Show/hide overlay at full snap
    overlay.style.display = (y <= FULL + 5) ? 'block' : 'none';
    setTimeout(function() {
      sheet.classList.remove('snapping');
      sheet.classList.remove('no-transition');
    }, 350);
  }

  setSnap(HALF, true);

  // Overlay click: collapse to peek
  overlay.onclick = function() { setSnap(PEEK, true); };

  // ===== DRAG HANDLE TOUCH =====
  var dragStartY = 0;
  var dragStartTranslate = 0;
  var isDragging = false;

  handle.addEventListener('touchstart', function(e) {
    e.stopPropagation();
    isDragging = true;
    dragStartY = e.touches[0].clientY;
    dragStartTranslate = currentTranslateY;
    sheet.classList.add('no-transition');
  }, {passive: false});

  handle.addEventListener('touchmove', function(e) {
    e.stopPropagation();
    if(!isDragging) return;
    var dy = e.touches[0].clientY - dragStartY;
    var newY = Math.max(FULL - 10, Math.min(PEEK + 10, dragStartTranslate + dy));
    currentTranslateY = newY;
    sheet.style.transform = 'translateY(' + newY + 'px)';
    overlay.style.display = (newY <= FULL + 5) ? 'block' : 'none';
  }, {passive: false});

  handle.addEventListener('touchend', function(e) {
    e.stopPropagation();
    isDragging = false;
    sheet.classList.remove('no-transition');
    // Snap to nearest point
    var nearest = snapPoints.reduce(function(prev, curr) {
      return Math.abs(curr - currentTranslateY) < Math.abs(prev - currentTranslateY) ? curr : prev;
    });
    setSnap(nearest, true);
  }, {passive: false});

  // ===== SHEET SCROLL AREA: allow drag only when at top =====
  var scrollDragStart = null;
  sheetScroll.addEventListener('touchstart', function(e) {
    scrollDragStart = {y: e.touches[0].clientY, scrollTop: sheetScroll.scrollTop};
  }, {passive: true});

  sheetScroll.addEventListener('touchmove', function(e) {
    if(!scrollDragStart) return;
    var dy = e.touches[0].clientY - scrollDragStart.y;
    // Drag sheet down only when already at top of scroll
    if(sheetScroll.scrollTop === 0 && dy > 0) {
      // Let the sheet drag logic handle it — but we need to propagate to handle
      // Instead: manually move sheet
      var newY = Math.min(PEEK + 10, currentTranslateY + dy * 0.5);
      if(newY > currentTranslateY) {
        sheet.classList.add('no-transition');
        currentTranslateY = newY;
        sheet.style.transform = 'translateY(' + newY + 'px)';
      }
    }
  }, {passive: true});

  sheetScroll.addEventListener('touchend', function() {
    if(sheetScroll.scrollTop === 0) {
      var nearest = snapPoints.reduce(function(prev, curr) {
        return Math.abs(curr - currentTranslateY) < Math.abs(prev - currentTranslateY) ? curr : prev;
      });
      setSnap(nearest, true);
    }
    scrollDragStart = null;
  }, {passive: true});

  // ===== INFRASTRUCTURE TOGGLE BUTTON =====
  var legendVisible = false;
  infraBtn.onclick = function() {
    legendVisible = !legendVisible;
    var legendEl = document.querySelector('.infra-legend');
    if(legendEl) {
      legendEl.style.display = legendVisible ? '' : 'none';
    }
    infraBtn.style.background = legendVisible ? '#2E86AB' : '#fff';
    infraBtn.style.color = legendVisible ? '#fff' : '#555';
  };

  // Hide legend by default on mobile
  setTimeout(function() {
    var legendEl = document.querySelector('.infra-legend');
    if(legendEl) legendEl.style.display = 'none';
  }, 100);

  // Invalidate map size after layout
  setTimeout(function() { map.invalidateSize(); }, 400);
})();

      var iconEl = m.mk.getElement();
      if(iconEl) iconEl.classList.remove('editing');
    }
    m.mk.unbindPopup();
    m.mk.bindPopup(buildPopupHtml(m.proj, editMode));
  });
};

// ===== MODAL STATE =====
var modalEditIdx = -1; // -1 means adding new

function openModal(title, showDelete) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('btn-modal-delete').style.display = showDelete ? '' : 'none';
  document.getElementById('edit-modal').classList.add('show');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('show');
  modalEditIdx = -1;
}

document.getElementById('btn-modal-cancel').onclick = closeModal;
document.getElementById('edit-modal').onclick = function(e) {
  if(e.target === this) closeModal();
};

// ===== OPEN EDIT MODAL =====
function openEditModal(idx) {
  var p = projects[idx];
  modalEditIdx = idx;
  document.getElementById('f-name').value = p.name || '';
  document.getElementById('f-type').value = p.type || '';
  document.getElementById('f-district').value = p.district || '';
  document.getElementById('f-price').value = p.price || '';
  document.getElementById('f-area').value = p.area || '';
  document.getElementById('f-beds').value = p.beds || '';
  document.getElementById('f-wc').value = p.wc || '';
  document.getElementById('f-addr').value = p.addr || '';
  document.getElementById('f-lat').value = p.lat || '';
  document.getElementById('f-lng').value = p.lng || '';
  document.getElementById('f-link').value = p.link || '';
  document.getElementById('f-note').value = p.note || '';
  document.getElementById('f-user-note').value = p.user_note || '';
  document.getElementById('f-starred').checked = !!p.starred;
  openModal('✏️ Edit: ' + p.name, true);
}

// ===== REBUILD ALL POPUPS + CARDS (call after delete to fix stale indices) =====
function rebuildAllPopupsAndCards() {
  markers.forEach(function(m) {
    m.mk.unbindPopup();
    m.mk.bindPopup(buildPopupHtml(m.proj, editMode));
    rebuildMarkerCard(m);
  });
}

// ===== DELETE PROJECT =====
function deleteProject(idx) {
  var p = projects[idx];
  if(!confirm('Xoá "' + p.name + '"?')) return;
  // Remove marker from cluster
  var m = markers[idx];
  clusterGroup.removeLayer(m.mk);
  if(m.listDesktop && m.listDesktop.parentNode) m.listDesktop.parentNode.removeChild(m.listDesktop);
  if(m.listMobile && m.listMobile.parentNode) m.listMobile.parentNode.removeChild(m.listMobile);
  // Splice both arrays
  projects.splice(idx, 1);
  markers.splice(idx, 1);
  // Rebuild all remaining popups + cards to fix stale index references
  rebuildAllPopupsAndCards();
  closeModal();
  markDirty();
}

document.getElementById('btn-modal-delete').onclick = function() {
  if(modalEditIdx >= 0) deleteProject(modalEditIdx);
};

// ===== SAVE MODAL =====
document.getElementById('btn-modal-save').onclick = function() {
  var name = document.getElementById('f-name').value.trim();
  var district = document.getElementById('f-district').value;
  var lat = parseFloat(document.getElementById('f-lat').value);
  var lng = parseFloat(document.getElementById('f-lng').value);
  if(!name) { alert('Tên dự án không được để trống'); return; }
  if(!district) { alert('Chọn quận'); return; }
  if(isNaN(lat) || isNaN(lng)) { alert('Lat/Lng phải là số'); return; }

  if(modalEditIdx >= 0) {
    // Edit existing
    var p = projects[modalEditIdx];
    p.name = name;
    p.type = document.getElementById('f-type').value.trim() || 'Chung cu';
    p.district = district;
    p.price = document.getElementById('f-price').value.trim();
    p.area = document.getElementById('f-area').value.trim();
    p.beds = document.getElementById('f-beds').value.trim();
    p.wc = document.getElementById('f-wc').value.trim();
    p.addr = document.getElementById('f-addr').value.trim();
    p.lat = lat;
    p.lng = lng;
    p.link = document.getElementById('f-link').value.trim();
    p.note = document.getElementById('f-note').value.trim();
    p.user_note = document.getElementById('f-user-note').value.trim();
    p.starred = document.getElementById('f-starred').checked;
    // Update marker position
    var m = markers[modalEditIdx];
    m.mk.setLatLng([lat, lng]);
    rebuildMarkerCard(m);
    markDirty();
    closeModal();
  } else {
    // Add new listing
    var newP = {
      name: name,
      type: document.getElementById('f-type').value.trim() || 'Chung cu',
      district: district,
      price: document.getElementById('f-price').value.trim(),
      area: document.getElementById('f-area').value.trim(),
      beds: document.getElementById('f-beds').value.trim(),
      wc: document.getElementById('f-wc').value.trim(),
      addr: document.getElementById('f-addr').value.trim(),
      lat: lat,
      lng: lng,
      link: document.getElementById('f-link').value.trim(),
      note: document.getElementById('f-note').value.trim(),
      user_note: document.getElementById('f-user-note').value.trim(),
      starred: document.getElementById('f-starred').checked,
      manual: true
    };
    addNewProject(newP);
    closeModal();
  }
};

// ===== ADD NEW PROJECT (shared by modal save + map click) =====
function addNewProject(p) {
  projects.push(p);
  var i = projects.length - 1;
  var color = districtColor(p.district);

  var icon = L.divIcon({
    className:'cm',
    html:'<div style="background:'+color+';color:white;border:2px solid '+color+';border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.3)">'+String(i+1)+'</div>',
    iconSize:[26,26],iconAnchor:[13,13]
  });

  var mk = L.marker([p.lat, p.lng], {icon:icon});
  mk.proj = p;
  if(editMode) mk.dragging.enable();

  mk.bindPopup(buildPopupHtml(p, editMode));
  mk.bindTooltip(p.name, {direction:'right', offset:[13,0], className:'bds-name-label'});

  mk.on('dragend', function(e) {
    var ll = e.target.getLatLng();
    p.lat = ll.lat;
    p.lng = ll.lng;
    markDirty();
  });

  mk.on('popupopen', function() {
    var idx = projects.indexOf(p);
    highlightListItem(idx);
  });

  // Build cards
  var bedsWcLocal = '';
  if(p.beds) bedsWcLocal += p.beds + ' PN';
  if(p.wc) bedsWcLocal += (bedsWcLocal ? ' | ' : '') + p.wc + ' WC';

  function makeNewCard() {
    var div = document.createElement('div');
    div.className = 'pi';
    div.dataset.district = p.district;
    div.dataset.idx = String(i);

    var stripe = document.createElement('div');
    stripe.className = 'pi-stripe';
    stripe.style.background = color;

    var body = document.createElement('div');
    body.className = 'pi-body';

    var row1 = document.createElement('div');
    row1.className = 'pi-row1';
    var nameEl = document.createElement('div');
    nameEl.className = 'pn';
    nameEl.textContent = String(i+1)+'. '+p.name;
    var badgeEl = document.createElement('span');
    badgeEl.className = 'badge badge-'+p.district;
    badgeEl.textContent = p.district.toUpperCase();
    row1.appendChild(nameEl);
    row1.appendChild(badgeEl);
    if(p.starred) {
      var s = document.createElement('span'); s.className='star-indicator'; s.textContent='⭐'; row1.appendChild(s);
    }
    if(p.user_note) {
      var n = document.createElement('span'); n.className='user-note-indicator'; n.title=p.user_note; n.textContent='📝'; row1.appendChild(n);
    }
    if(p.manual) {
      var mb = document.createElement('span'); mb.className='manual-badge'; mb.textContent='M'; row1.appendChild(mb);
    }

    var row2 = document.createElement('div');
    row2.className = 'pi-row2';
    if(p.price) {
      var priceEl = document.createElement('span');
      priceEl.className = 'price-chip';
      priceEl.textContent = p.price;
      row2.appendChild(priceEl);
    }
    if(p.area) {
      var areaEl = document.createElement('span');
      areaEl.className = 'pf';
      areaEl.textContent = p.area;
      row2.appendChild(areaEl);
    }
    if(bedsWcLocal) {
      var bedsEl = document.createElement('span');
      bedsEl.className = 'pf';
      bedsEl.textContent = bedsWcLocal;
      row2.appendChild(bedsEl);
    }
    var row3 = document.createElement('div');
    row3.className = 'pf-addr';
    row3.textContent = p.addr || '';

    body.appendChild(row1);
    body.appendChild(row2);
    body.appendChild(row3);
    div.appendChild(stripe);
    div.appendChild(body);
    return div;
  }

  var cardDesktop = makeNewCard();
  var cardMobile = makeNewCard();

  cardDesktop.onclick = (function(pt, m) { return function() { map.setView([pt.lat,pt.lng],17); m.openPopup(); }; })(p, mk);
  cardMobile.onclick = (function(pt, m) { return function() { map.setView([pt.lat,pt.lng],17); m.openPopup(); }; })(p, mk);

  listEl.appendChild(cardDesktop);
  listMobileEl.appendChild(cardMobile);

  var mEntry = {mk:mk, proj:p, data:p, listDesktop:cardDesktop, listMobile:cardMobile};
  markers.push(mEntry);
  clusterGroup.addLayer(mk);

  markDirty();
}

// ===== TOGGLE STAR =====
function toggleStar(idx) {
  var p = projects[idx];
  p.starred = !p.starred;
  var m = markers[idx];
  rebuildMarkerCard(m);
  // Re-open popup to reflect change
  if(m.mk.isPopupOpen()) {
    m.mk.unbindPopup();
    m.mk.bindPopup(buildPopupHtml(p, editMode));
    m.mk.openPopup();
  }
  markDirty();
}

// ===== ADD LISTING — MAP CLICK MODE =====
var addPickMode = false;
document.getElementById('btn-add-listing').onclick = function() {
  if(addPickMode) return;
  addPickMode = true;
  document.getElementById('map').style.cursor = 'crosshair';
  map.once('click', function(e) {
    addPickMode = false;
    document.getElementById('map').style.cursor = '';
    // Pre-fill lat/lng, clear rest
    modalEditIdx = -1;
    document.getElementById('f-name').value = '';
    document.getElementById('f-type').value = '';
    document.getElementById('f-district').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-area').value = '';
    document.getElementById('f-beds').value = '';
    document.getElementById('f-wc').value = '';
    document.getElementById('f-addr').value = '';
    document.getElementById('f-lat').value = e.latlng.lat.toFixed(7);
    document.getElementById('f-lng').value = e.latlng.lng.toFixed(7);
    document.getElementById('f-link').value = '';
    document.getElementById('f-note').value = '';
    document.getElementById('f-user-note').value = '';
    document.getElementById('f-starred').checked = false;
    openModal('➕ Add listing', false);
  });
};

// ===== EXPORT JSON =====
document.getElementById('btn-export-json').onclick = function() {
  var blob = new Blob([JSON.stringify(projects, null, 2)], {type:'application/json;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'projects.json';
  a.click();
  URL.revokeObjectURL(url);
  alert('Đã download projects.json. Hãy thay file output/projects.json rồi commit.');
  localStorage.removeItem(STORAGE_KEY);
  dirty = false;
  document.getElementById('dirty-badge').classList.remove('show');
  window.onbeforeunload = null;
};

// ===== DRAG END for existing markers =====
markers.forEach(function(m) {
  m.proj = m.data; // alias proj -> data for existing markers built before edit mode code
  m.mk.on('dragend', function(e) {
    var ll = e.target.getLatLng();
    m.proj.lat = ll.lat;
    m.proj.lng = ll.lng;
    markDirty();
  });
});

// ===== RESTORE BANNER =====
(function() {
  var saved = localStorage.getItem(STORAGE_KEY);
  if(!saved) return;
  try {
    var parsed = JSON.parse(saved);
    if(!Array.isArray(parsed) || parsed.length === 0) return;
    // Show banner
    document.getElementById('restore-banner').classList.add('show');
  } catch(e) { localStorage.removeItem(STORAGE_KEY); }
})();

document.getElementById('btn-restore').onclick = function() {
  var saved = localStorage.getItem(STORAGE_KEY);
  if(!saved) return;
  try {
    var parsed = JSON.parse(saved);
    // Clear current markers + cards
    clusterGroup.clearLayers();
    markers.forEach(function(m) {
      if(m.listDesktop && m.listDesktop.parentNode) m.listDesktop.parentNode.removeChild(m.listDesktop);
      if(m.listMobile && m.listMobile.parentNode) m.listMobile.parentNode.removeChild(m.listMobile);
    });
    markers.length = 0;
    projects.length = 0;
    // Re-populate
    parsed.forEach(function(p) {
      projects.push(p);
    });
    // Rebuild markers for all projects
    projects.forEach(function(p) {
      var i = projects.indexOf(p);
      var color = districtColor(p.district);
      var icon = L.divIcon({
        className:'cm',
        html:'<div style="background:'+color+';color:white;border:2px solid '+color+';border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.3)">'+String(i+1)+'</div>',
        iconSize:[26,26],iconAnchor:[13,13]
      });
      var mk = L.marker([p.lat, p.lng], {icon:icon});
      mk.proj = p;
      mk.bindPopup(buildPopupHtml(p, editMode));
      mk.bindTooltip(p.name, {direction:'right', offset:[13,0], className:'bds-name-label'});
      mk.on('dragend', function(e) {
        var ll = e.target.getLatLng();
        p.lat = ll.lat; p.lng = ll.lng;
        markDirty();
      });
      mk.on('popupopen', function() { highlightListItem(projects.indexOf(p)); });

      var bedsWcR = '';
      if(p.beds) bedsWcR += p.beds + ' PN';
      if(p.wc) bedsWcR += (bedsWcR ? ' | ' : '') + p.wc + ' WC';

      function makeRestoredCard() {
        var div = document.createElement('div');
        div.className = 'pi'; div.dataset.district = p.district; div.dataset.idx = String(i);
        var stripe = document.createElement('div'); stripe.className='pi-stripe'; stripe.style.background=color;
        var body = document.createElement('div'); body.className='pi-body';
        var row1 = document.createElement('div'); row1.className='pi-row1';
        var nameEl = document.createElement('div'); nameEl.className='pn'; nameEl.textContent=String(i+1)+'. '+p.name;
        var badgeEl = document.createElement('span'); badgeEl.className='badge badge-'+p.district; badgeEl.textContent=p.district.toUpperCase();
        row1.appendChild(nameEl); row1.appendChild(badgeEl);
        if(p.starred){var s=document.createElement('span');s.className='star-indicator';s.textContent='⭐';row1.appendChild(s);}
        if(p.user_note){var n=document.createElement('span');n.className='user-note-indicator';n.title=p.user_note;n.textContent='📝';row1.appendChild(n);}
        if(p.manual){var mb=document.createElement('span');mb.className='manual-badge';mb.textContent='M';row1.appendChild(mb);}
        var row2=document.createElement('div');row2.className='pi-row2';
        if(p.price){var pe=document.createElement('span');pe.className='price-chip';pe.textContent=p.price;row2.appendChild(pe);}
        if(p.area){var ae=document.createElement('span');ae.className='pf';ae.textContent=p.area;row2.appendChild(ae);}
        if(bedsWcR){var be=document.createElement('span');be.className='pf';be.textContent=bedsWcR;row2.appendChild(be);}
        var row3=document.createElement('div');row3.className='pf-addr';row3.textContent=p.addr||'';
        body.appendChild(row1);body.appendChild(row2);body.appendChild(row3);
        div.appendChild(stripe);div.appendChild(body);
        return div;
      }
      var cd = makeRestoredCard(); var cm2 = makeRestoredCard();
      cd.onclick=(function(pt,m2){return function(){map.setView([pt.lat,pt.lng],17);m2.openPopup();};})(p,mk);
      cm2.onclick=(function(pt,m2){return function(){map.setView([pt.lat,pt.lng],17);m2.openPopup();};})(p,mk);
      listEl.appendChild(cd); listMobileEl.appendChild(cm2);
      var mEntry={mk:mk,proj:p,data:p,listDesktop:cd,listMobile:cm2};
      markers.push(mEntry);
      clusterGroup.addLayer(mk);
    });
    document.getElementById('restore-banner').classList.remove('show');
    dirty = true;
    var badge = document.getElementById('dirty-badge');
    badge.textContent = 'Có thay đổi'; badge.classList.add('show');
  } catch(e) { alert('Lỗi restore: ' + e.message); }
};

document.getElementById('btn-discard').onclick = function() {
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('restore-banner').classList.remove('show');
};
</script>
